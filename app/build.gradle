plugins {
    id 'com.android.application'
}

// cmajor only ships prebuilt LLVM static libs for Android/arm64 - x86_64 is only
// buildable once someone drops matching libs into
// src/main/cpp/3rdParty/llvm/release/android/x64 (see external/cmajor/modules/CMakeLists.txt).
// Treat that ABI as optional so `./gradlew build` still succeeds without it.
def x64CmajorLlvmLibsExist = file("src/main/cpp/3rdParty/llvm/release/android/x64/cmake_platforms").exists()

if (!x64CmajorLlvmLibsExist)
    logger.warn("cmajor: no prebuilt LLVM libs found for Android x86_64 - building arm64-v8a only")

android {
    namespace 'org.androidaudioplugin.ports.cmajor'
    compileSdk = libs.versions.android.compileSdk.get().toInteger()
    defaultConfig {
        applicationId "org.androidaudioplugin.ports.cmajor"
        minSdk = libs.versions.android.minSdk.get().toInteger()
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        proguardFiles 'proguard-rules.pro'

        ndk {
            if (x64CmajorLlvmLibsExist)
                abiFilters "x86_64", "arm64-v8a"
            else
                abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                // https://github.com/google/prefab/blob/bccf5a6a75b67add30afbb6d4f7a7c50081d2d86/api/src/main/kotlin/com/google/prefab/api/Android.kt#L243
                // Native code is always built as Release, even for the debug variant: an
                // unoptimised cmajor compiler makes JIT-loading a patch far too slow.
                arguments "-DANDROID_STL=c++_shared", "-DAAP_ENABLE_ASAN=" + (enable_asan ? "1" : "0"),
                        "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    // see androidaudioplugin/build.gradle for details...
    ndkVersion libs.versions.ndk.get()

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version libs.versions.cmake.get()
        }
    }
    buildFeatures {
        prefab true
    }
    sourceSets {
        main {
            // The Java half of choc::ui::WebView's Android backend - see
            // src/main/cpp/include/choc/choc/gui/choc_AndroidWebViewJNI.h
            java.srcDirs += 'src/main/cpp/include/choc/choc/gui/android'
        }
    }
    packagingOptions{
        // for debugging and ASan settings
        //doNotStrip "*/*/*.so"
        if (enable_asan)
            jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation libs.aap.core
    implementation libs.aap.midi.device.service
    implementation libs.aap.ui.compose
    implementation libs.aap.ui.compose.app
    implementation libs.aap.ui.web
    androidTestImplementation libs.aap.testing
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.androidx.rules
    //  If you want to test aap-core locally, switch to these local references
    //  (along with settings.gradle.kts changes)
    /*
    implementation project(":androidaudioplugin")
    implementation project(":androidaudioplugin-midi-device-service")
    implementation project(":androidaudioplugin-manager")
    implementation project(":androidaudioplugin-ui-compose-app")
    implementation project(":androidaudioplugin-ui-web")
    androidTestImplementation project(":androidaudioplugin-testing")
     */
}
