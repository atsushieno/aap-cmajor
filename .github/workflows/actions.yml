name: build dist

on:
  workflow_call:

permissions:
  contents: write

jobs:
  linux-build:
    name: build on linux
    runs-on: ubuntu-24.04
    env:
      # Signing is skipped until these secrets are set up for Play Store releases.
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      # Share one clone of cmajor's prebuilt LLVM (several GBs) across all native builds.
      CPM_SOURCE_CACHE: /home/runner/.cache/CPM
    steps:
    - name: free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /
    - name: checkout
      uses: actions/checkout@v4
    - name: checkout submodules
      # cmajor's submodules use SSH URLs, which cannot be cloned anonymously.
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --recursive
    - name: apply patches
      run: make apply-patches
    - name: apt update
      run: |
        sudo apt-get update
    - name: apt install
      run: |
        echo y | sudo apt-get install doxygen libxml2-dev libgrpc++-dev libgrpc-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc graphviz cmake ninja-build
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
    - name: cache gradle caches
      uses: actions/cache@v4
      env:
        cache-name: cache-gradle-caches
      with:
        path: /home/runner/.gradle/caches/
        key: ${{ runner.os }}-gradle-caches
    - name: build aap-core
      run: ./gradlew publishToMavenLocal
      working-directory: external/aap-core
    - name: Bump version
      uses: chkfung/android-version-actions@v1.2.1
      with:
        gradlePath: app/build.gradle
        versionCode: ${{github.run_number}}
    - name: build
      run: ./gradlew build bundle
    - name: Sign app bundle
      if: env.SIGNING_KEY_BASE64 != ''
      uses: ilharp/sign-android-release@v2
      id: sign_app
      with:
        releaseDir: app/build/outputs/bundle/release
        signingKey: ${{ secrets.SIGNING_KEY_BASE64 }}
        keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    - name: upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: apks and aabs
        path: |
          app/build/outputs/apk/debug/*.apk
          ${{ steps.sign_app.outputs.signedFile }}
    - name: Create Release
      uses: ncipollo/release-action@v1.21.0
      if: success() && startsWith(github.ref, 'refs/tags/')
      with:
        artifacts: app/build/outputs/apk/debug/*.apk,${{ steps.sign_app.outputs.signedFile }}
